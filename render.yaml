# Render Blueprint for NOVA — frontend only.
#
# Where everything runs:
#   - Frontend          : this blueprint. Vite build served as a small Node web
#                         service on Render's free plan.
#   - Backend (FastAPI) : a Hugging Face Space, not Render. See
#                         deploy/hf-space/. Render's free plan gives 512MB of RAM,
#                         which fits the API but not the ~1GB of emotion-model
#                         weights; a free Space gives 16GB, so all three modalities
#                         (text / face / voice) run there on CPU.
#   - Chat/report brain : the Groq API, called from the Space. The local Ollama
#                         server is unreachable from the cloud.
#
# Setup order:
#   1. Publish the models and the Space:  python scripts/publish_to_hf.py
#   2. Set GROQ_API_KEY on the Space (Settings -> Variables and secrets).
#      Free key: https://console.groq.com/keys
#   3. Deploy this blueprint, set VITE_API_URL on nova-frontend to the Space URL
#      (e.g. https://veeda241-nova-backend.hf.space), then redeploy the frontend.
#
# If an older nova-backend service from a previous version of this file is still
# on your Render account, delete it there — removing it from the blueprint does
# not shut it down.
#
# Local development stays 100% local: Ollama + Unsloth GGUF, no API key needed.

services:
  - type: web
    name: nova-frontend
    runtime: node
    plan: free
    rootDir: client
    # `serve` is a devDependency, so no global install is needed (Render's
    # build user can't write to /usr/lib/node_modules).
    buildCommand: npm install && npm run build
    startCommand: npx serve -s dist -l $PORT
    envVars:
      - key: VITE_API_URL
        sync: false
        # Set this to the Space URL BEFORE building, then redeploy the frontend —
        # Vite bakes it in at build time, so a later change needs a rebuild.
      - key: GEMINI_API_KEY
        sync: false
        # Optional: only used as a client-side fallback if the backend is unreachable.
